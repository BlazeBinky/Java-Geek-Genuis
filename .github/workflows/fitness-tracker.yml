name: Build FitTrack for Lumia ARM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'FitnessTracker/**'
      - '.github/workflows/fitness-tracker.yml'

permissions:
  contents: write

concurrency:
  group: fittrack-lumia-build
  cancel-in-progress: false

jobs:
  build-arm:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate app artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $assets = Join-Path $PWD 'FitnessTracker/Assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          function New-FitTrackPng([string]$name, [int]$w, [int]$h) {
            $bmp = [System.Drawing.Bitmap]::new($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([System.Drawing.Color]::FromArgb(10, 17, 31))
            $accent = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(90, 230, 192))
            $ring = [System.Drawing.Pen]::new([System.Drawing.Color]::FromArgb(45, 70, 90), [single]([Math]::Max(2, $w * 0.025)))
            $diameter = [single]([Math]::Min($w, $h) * 0.62)
            $x = [single](($w - $diameter) / 2)
            $y = [single](($h - $diameter) / 2)
            $g.DrawEllipse($ring, $x, $y, $diameter, $diameter)
            $fontSize = [single]([Math]::Min($w, $h) * 0.34)
            $font = [System.Drawing.Font]::new('Segoe UI', $fontSize, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
            $format = [System.Drawing.StringFormat]::new()
            $format.Alignment = [System.Drawing.StringAlignment]::Center
            $format.LineAlignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString('F', $font, $accent, [System.Drawing.RectangleF]::new(0, 0, $w, $h), $format)
            $dest = Join-Path $assets $name
            $bmp.Save($dest, [System.Drawing.Imaging.ImageFormat]::Png)
            $format.Dispose(); $font.Dispose(); $ring.Dispose(); $accent.Dispose(); $g.Dispose(); $bmp.Dispose()
          }

          New-FitTrackPng 'StoreLogo.png' 50 50
          New-FitTrackPng 'Square44x44Logo.png' 44 44
          New-FitTrackPng 'Square150x150Logo.png' 150 150
          New-FitTrackPng 'Wide310x150Logo.png' 310 150
          New-FitTrackPng 'SplashScreen.png' 620 300

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows 10 Mobile ARM package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild FitnessTracker/FitnessTracker.csproj /restore /m /p:Configuration=Release /p:Platform=ARM /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "FitTrack ARM build failed with exit code $LASTEXITCODE" }

      - name: Sign AppX with a development certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $passwordText = "FitTrackDev-$env:GITHUB_RUN_ID"
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=BlazeBinky" -KeyUsage DigitalSignature -FriendlyName "FitTrack Development" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $certDir = Join-Path $PWD 'FitnessTracker/InstallCertificate'
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath (Join-Path $certDir 'FitTrackDev.pfx') -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $certDir 'FitTrackDev.cer') | Out-Null

          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $roots = @((Join-Path $pf86 'Windows Kits\10\bin'), (Join-Path $env:ProgramFiles 'Windows Kits\10\bin'))
          $tools = @()
          foreach ($root in $roots) {
            if (Test-Path $root) { $tools += Get-ChildItem $root -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue }
          }
          $signtool = $tools | Where-Object { $_.FullName -match '\\(x64|arm64)\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'SignTool was not found in the installed Windows SDK.' }

          $appx = Get-ChildItem 'FitnessTracker/AppPackages' -Recurse -Filter '*.appx' | Where-Object { $_.Name -notmatch 'Symbols' } | Select-Object -First 1
          if (-not $appx) { throw 'MSBuild completed without producing an .appx package.' }
          & $signtool.FullName sign /fd SHA256 /f (Join-Path $certDir 'FitTrackDev.pfx') /p $passwordText $appx.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing failed with exit code $LASTEXITCODE" }
          Write-Host "Signed package: $($appx.FullName)"

      - name: Prepare direct-download assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appx = Get-ChildItem 'FitnessTracker/AppPackages' -Recurse -Filter '*.appx' | Where-Object { $_.Name -notmatch 'Symbols' } | Select-Object -First 1
          if (-not $appx) { throw 'Cannot prepare release: no AppX package was found.' }
          $releaseDir = Join-Path $PWD 'releaseassets'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item $appx.FullName (Join-Path $releaseDir 'FitTrack-Lumia-ARM.appx') -Force
          Copy-Item 'FitnessTracker/InstallCertificate/FitTrackDev.cer' (Join-Path $releaseDir 'FitTrackDev.cer') -Force

      - name: Upload installable ARM package and certificate
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-Lumia-ARM
          path: |
            FitnessTracker/AppPackages/**/*.appx
            FitnessTracker/InstallCertificate/FitTrackDev.cer
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: fittrack-lumia
          target_commitish: ${{ github.sha }}
          name: FitTrack for Windows 10 Mobile (Lumia ARM)
          body: |
            FitTrack is an offline-first fitness tracker package for Windows 10 Mobile ARM devices.
            Install the included FitTrackDev.cer certificate before installing the AppX. This is a development-signed sideload package.
          files: |
            releaseassets/FitTrack-Lumia-ARM.appx
            releaseassets/FitTrackDev.cer
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-build-diagnostics
          path: |
            FitnessTracker/AppPackages/**
            FitnessTracker/bin/ARM/Release/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build ARM app package
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild PongoLumia\PongoLumia.csproj /restore /m /v:minimal /p:Configuration=Release /p:Platform=ARM /p:UseDotNetNativeToolchain=false /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly '/flp:logfile=build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw "ARM build failed with exit code $LASTEXITCODE" }
          $appx = Get-ChildItem PongoLumia -Recurse -Filter '*.appx' | Where-Object { $_.FullName -notmatch '\\Dependencies\\|Symbols|TestCertificate' } | Select-Object -First 1
          if (-not $appx) { throw 'Build succeeded but no ARM .appx was produced.' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $appx.FullName out\Pongo-ARM-unsigned.appx
      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pongo-MSBuild-Diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Sign package and collect dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=BlazeBinky' -KeyUsage DigitalSignature -FriendlyName 'Pongo Lumia test signing' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath out\Pongo-TestCertificate.cer | Out-Null
          $pw = ConvertTo-SecureString "PongoDev-$env:GITHUB_RUN_ID" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath out\temporary.pfx -Password $pw | Out-Null
          $sdk = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $sign = Get-ChildItem $sdk -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sign) { throw 'SignTool not found in Windows SDK.' }
          & $sign.FullName sign /fd SHA256 /f out\temporary.pfx /p "PongoDev-$env:GITHUB_RUN_ID" out\Pongo-ARM-unsigned.appx
          if ($LASTEXITCODE -ne 0) { throw 'Package signing failed.' }
          Move-Item out\Pongo-ARM-unsigned.appx out\Pongo-ARM.appx -Force
          Remove-Item out\temporary.pfx -Force
          New-Item -ItemType Directory -Force out\Dependencies | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $deps = Get-ChildItem PongoLumia -Recurse -Filter '*.appx' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\Dependencies\\' }
          foreach ($dep in $deps) {
            $archive = $null
            $reader = $null
            $arch = ''
            $pkgName = ''
            try {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($dep.FullName)
              $entry = $archive.GetEntry('AppxManifest.xml')
              if (-not $entry) { continue }
              $reader = [System.IO.StreamReader]::new($entry.Open())
              [xml]$depManifest = $reader.ReadToEnd()
              $identity = $depManifest.SelectSingleNode("//*[local-name()='Package']/*[local-name()='Identity']")
              if (-not $identity) { continue }
              $arch = $identity.GetAttribute('ProcessorArchitecture')
              $pkgName = $identity.GetAttribute('Name')
            }
            finally {
              if ($reader) { $reader.Dispose() }
              if ($archive) { $archive.Dispose() }
            }
            if ($arch -eq 'arm' -or $arch -eq 'neutral') {
              Copy-Item $dep.FullName (Join-Path out\Dependencies $dep.Name) -Force
              Write-Host "Included dependency $pkgName ($arch): $($dep.Name)"
            }
            else {
              Write-Host "Skipped non-ARM dependency $pkgName ($arch): $($dep.Name)"
            }
          }
          if (-not (Test-Path (Join-Path out\Dependencies 'Microsoft.NET.CoreRuntime.1.1.appx'))) { throw 'ARM .NET Core Runtime 1.1 dependency missing from output.' }
          if (-not (Test-Path (Join-Path out\Dependencies 'Microsoft.VCLibs.ARM.14.00.appx'))) { throw 'ARM Microsoft VCLibs dependency missing from output.' }

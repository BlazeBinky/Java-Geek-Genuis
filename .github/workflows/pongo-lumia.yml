          Local AI setup: first launch needs internet once to download the public model file from Hugging Face. Tap “Get local AI model (~94 MB)” and keep the app open until download and loading finish. After the file is stored locally, model prompts run on the phone with no AI API, account, token, or per-request network call. The mini helper remains usable offline if the model is not installed. This is a small 135M-parameter model, not comparable to a large cloud model; answers can be inaccurate and inference may be slow on the Lumia 950. Model file source: https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF. The base model is provided under Apache-2.0; see the publisher’s model card and notices for exact terms. ‘Web search’ opens the browser separately and needs internet. Code Lab exports starter source; compiling/signing real .appx packages still requires Windows SDK/MSBuild on a PC. This app cannot replace protected Cortana or provide an always-on wake word. Test on the actual Lumia. Install ARM dependencies first; do not install x86, x64, or ARM64 dependencies on a Lumia 950.

name: Build Pongo Lumia ARM package
on:
  push:
    paths:
      - '.github/workflows/pongo-lumia.yml'
      - 'PongoSource/MainPage.xaml'
      - 'PongoSource/MainPage.xaml.cs'
      - 'PongoSource/PongoLlmNative.cpp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp for local ARM32 inference
        shell: pwsh
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
      - name: Adapt llama.cpp memory APIs for Windows 10 Mobile UWP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          #include "ggml-backend-dl.h"
          dl_handle * dl_load_library(const fs::path & path) { (void)path; return nullptr; }
          void * dl_get_sym(dl_handle * handle, const char * name) { (void)handle; (void)name; return nullptr; }
          const char * dl_error() { return "Dynamic backends are disabled in the UWP ARM32 build."; }
          '@ | Set-Content 'llama.cpp/ggml/src/ggml-backend-dl.cpp' -Encoding utf8
          $path = 'llama.cpp/src/llama-mmap.cpp'
          $source = Get-Content $path -Raw
          $source = $source.Replace('#include <windows.h>', '#include <windows.h>' + [Environment]::NewLine + '#include <memoryapi.h>')
          $source = $source.Replace('CreateFileMappingA(hFile, NULL, PAGE_READONLY, 0, 0, NULL)', 'CreateFileMappingFromApp(hFile, NULL, PAGE_READONLY, 0, NULL)')
          $source = $source.Replace('MapViewOfFile(hMapping, FILE_MAP_READ, 0, 0, 0)', 'MapViewOfFileFromApp(hMapping, FILE_MAP_READ, 0, 0)')
          $source = $source.Replace('#if _WIN32_WINNT >= 0x602', '#if _WIN32_WINNT >= 0x602 && WINAPI_FAMILY_PARTITION(WINAPI_PARTITION_DESKTOP)')
          $source = $source.Replace('(defined(_WIN32) && _WIN32_WINNT >= 0x602)', '(defined(_WIN32) && _WIN32_WINNT >= 0x602 && WINAPI_FAMILY_PARTITION(WINAPI_PARTITION_DESKTOP))')
          $mlockStart = $source.IndexOf('// llama_mlock')
          if ($mlockStart -lt 0) { throw 'Could not find llama_mlock implementation.' }
          $before = $source.Substring(0, $mlockStart)
          $after = $source.Substring($mlockStart)
          $branch = $after.IndexOf('#elif defined(_WIN32)')
          if ($branch -lt 0) { throw 'Could not find Windows mlock implementation.' }
          $after = $after.Substring(0, $branch) + $after.Substring($branch).Replace('#elif defined(_WIN32)', '#elif defined(_WIN32) && WINAPI_FAMILY_PARTITION(WINAPI_PARTITION_DESKTOP)')
          [IO.File]::WriteAllText((Resolve-Path $path), $before + $after, [Text.UTF8Encoding]::new($false))
          Write-Host 'UWP-safe file mapping enabled; desktop-only prefetch and locking disabled.'
      - name: Add Pongo native inference DLL target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          add_library(PongoLlmNative SHARED "${CMAKE_SOURCE_DIR}/../PongoSource/PongoLlmNative.cpp")
          target_link_libraries(PongoLlmNative PRIVATE llama OneCore)
          target_include_directories(PongoLlmNative PRIVATE "${CMAKE_SOURCE_DIR}/include")
          set_target_properties(PongoLlmNative PROPERTIES OUTPUT_NAME PongoLlmNative)
          '@ | Add-Content 'llama.cpp/CMakeLists.txt' -Encoding utf8
      - name: Configure llama.cpp for Windows Store ARM32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S llama.cpp -B build-llama -G "Visual Studio 17 2022" -A "ARM,version=10.0.22621.0" -DCMAKE_SYSTEM_NAME=WindowsStore '-DCMAKE_SYSTEM_VERSION=10.0.22621.0' '-DCMAKE_SYSTEM_PROCESSOR=ARM' '-DCMAKE_CXX_FLAGS=/D_WIN32_WINNT=0x0602' -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_CURL=OFF
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp ARM32 configure failed: $LASTEXITCODE" }
      - name: Build Pongo native inference engine (ARM32)
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-llama --config Release --target PongoLlmNative -- /m
          if ($LASTEXITCODE -ne 0) { throw "Pongo ARM32 native inference build failed: $LASTEXITCODE" }
          $dll = Get-ChildItem build-llama -Recurse -Filter 'PongoLlmNative.dll' | Select-Object -First 1
          if (-not $dll) { throw 'PongoLlmNative.dll was not produced.' }
          $appRoot = Join-Path $PWD 'PongoLumia'
          New-Item -ItemType Directory -Force $appRoot | Out-Null
          Copy-Item $dll.FullName (Join-Path $appRoot 'PongoLlmNative.dll') -Force
          Write-Host "Packaged native engine: $($dll.FullName) ($((Get-Item $dll.FullName).Length) bytes)"
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate native UWP project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'PongoLumia'
          New-Item -ItemType Directory -Force $root, (Join-Path $root 'Assets') | Out-Null
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project ToolsVersion="15.0" DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$(MSBuildExtensionsPath)\$(MSBuildToolsVersion)\Microsoft.Common.props" Condition="Exists('$(MSBuildExtensionsPath)\$(MSBuildToolsVersion)\Microsoft.Common.props')" />
            <PropertyGroup>
              <ProjectGuid>{C27E06E4-47B0-4D93-A0C0-4A7AA9D7A55C}</ProjectGuid><ProjectTypeGuids>{A5A43C5B-DE2A-4C0C-9213-0A381AF9435A};{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}</ProjectTypeGuids><WindowsXamlEnableOverview>true</WindowsXamlEnableOverview><EnableDotNetNativeCompatibleProfile>true</EnableDotNetNativeCompatibleProfile><OutputType>AppContainerExe</OutputType><RootNamespace>PongoLumia</RootNamespace><AssemblyName>PongoLumia</AssemblyName><DefaultLanguage>en-US</DefaultLanguage><TargetPlatformIdentifier>UAP</TargetPlatformIdentifier><TargetPlatformVersion>10.0.19041.0</TargetPlatformVersion><TargetPlatformMinVersion>10.0.14393.0</TargetPlatformMinVersion><MinimumVisualStudioVersion>14.0</MinimumVisualStudioVersion><AppxPackageSigningEnabled>false</AppxPackageSigningEnabled><AppxBundle>Never</AppxBundle><RestoreProjectStyle>PackageReference</RestoreProjectStyle>
            </PropertyGroup>
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|ARM'"><PlatformTarget>ARM</PlatformTarget><OutputPath>bin\ARM\Release\</OutputPath><Optimize>true</Optimize><DefineConstants>TRACE;NETFX_CORE;WINDOWS_UWP</DefineConstants><UseDotNetNativeToolchain>false</UseDotNetNativeToolchain></PropertyGroup>
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Debug|ARM'"><PlatformTarget>ARM</PlatformTarget><OutputPath>bin\ARM\Debug\</OutputPath><DefineConstants>DEBUG;TRACE;NETFX_CORE;WINDOWS_UWP</DefineConstants><UseDotNetNativeToolchain>false</UseDotNetNativeToolchain></PropertyGroup>
            <ItemGroup><Compile Include="App.xaml.cs"><DependentUpon>App.xaml</DependentUpon></Compile><Compile Include="MainPage.xaml.cs"><DependentUpon>MainPage.xaml</DependentUpon></Compile></ItemGroup>
            <ItemGroup><ApplicationDefinition Include="App.xaml"><Generator>MSBuild:Compile</Generator></ApplicationDefinition><Page Include="MainPage.xaml"><Generator>MSBuild:Compile</Generator></Page></ItemGroup>
            <ItemGroup><Content Include="Assets\StoreLogo.png"/><Content Include="Assets\Square150x150Logo.png"/><Content Include="Assets\Square44x44Logo.png"/><Content Include="Assets\Wide310x150Logo.png"/><Content Include="Assets\SplashScreen.png"/><Content Include="PongoLlmNative.dll"/><AppxManifest Include="Package.appxmanifest"/></ItemGroup>
            <ItemGroup><PackageReference Include="Microsoft.NETCore.UniversalWindowsPlatform" Version="6.2.14" /></ItemGroup>
            <Import Project="$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets" />
          </Project>
          '@ | Set-Content (Join-Path $root 'PongoLumia.csproj') -Encoding utf8
          @'
          <Application x:Class="PongoLumia.App" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"><Application.Resources><ResourceDictionary><SolidColorBrush x:Key="AccentBrush" Color="#FF238FE0"/></ResourceDictionary></Application.Resources></Application>
          '@ | Set-Content (Join-Path $root 'App.xaml') -Encoding utf8
          @'
          using Windows.ApplicationModel.Activation;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;
          namespace PongoLumia {
            sealed partial class App : Application {
              public App(){ InitializeComponent(); }
              protected override void OnLaunched(LaunchActivatedEventArgs e) {
                var frame = Window.Current.Content as Frame;
                if(frame == null){ frame = new Frame(); Window.Current.Content = frame; }
                if(frame.Content == null) frame.Navigate(typeof(MainPage), e.Arguments);
                Window.Current.Activate();
              }
            }
          }
          '@ | Set-Content (Join-Path $root 'App.xaml.cs') -Encoding utf8
          @'
          <Page x:Class="PongoLumia.MainPage" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" Background="#FF0B1020">
            <Grid>
              <Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="*"/><RowDefinition Height="Auto"/></Grid.RowDefinitions>
              <Grid Padding="12,9">
                <Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>
                <StackPanel Orientation="Horizontal"><Image Width="42" Height="42" Source="Assets/Square150x150Logo.png" Margin="0,0,9,0"/><StackPanel VerticalAlignment="Center"><TextBlock Text="PONGO" Foreground="White" FontSize="22" FontWeight="SemiBold"/><TextBlock Text="Penguin intelligence. Obviously." Foreground="#FF9DB1D1" FontSize="12"/></StackPanel></StackPanel>
                <Button Grid.Column="1" Content="⚙ AI" Click="Settings_Click" VerticalAlignment="Center" Margin="4" />
              </Grid>
              <ScrollViewer Grid.Row="1" Margin="10,0" VerticalScrollBarVisibility="Auto"><StackPanel>
                <TextBlock x:Name="Welcome" Text="Oh, good. You're here. Ask me something. I am excellent company." Foreground="White" FontSize="23" TextWrapping="Wrap" Margin="3,8,3,12"/>
                <TextBlock Text="CHAT" Foreground="#FF6EBBFF" FontSize="12" FontWeight="SemiBold" Margin="3,0,0,5"/>
                <TextBox x:Name="Conversation" IsReadOnly="True" TextWrapping="Wrap" AcceptsReturn="True" MinHeight="225" Background="#FF11192B" Foreground="#FFE7F1FF" FontSize="15" BorderThickness="0" Padding="12" IsSpellCheckEnabled="False"/>
                <TextBlock x:Name="Status" Text="Offline helper ready" Foreground="#FF8CA6C8" Margin="4,8,0,12" TextWrapping="Wrap"/>
                <Border x:Name="AiSettingsPanel" Visibility="Collapsed" Background="#FF151F34" BorderBrush="#FF2C4263" BorderThickness="1" CornerRadius="10" Padding="12" Margin="0,0,0,10">
                  <StackPanel>
                    <TextBlock Text="PONGO AI SETTINGS" Foreground="White" FontWeight="SemiBold" FontSize="19" Margin="0,0,0,5"/>
                    <TextBlock Text="Offline mode works without an account. For more capable answers and code, enable Hugging Face hosted AI below. Prompts are sent to Hugging Face when enabled." Foreground="#FFBACBE2" TextWrapping="Wrap" Margin="0,0,0,9"/>
                    <CheckBox x:Name="UseHfAi" Content="Use Hugging Face hosted AI" Foreground="White" Margin="0,0,0,8"/>
                    <TextBlock Text="Model ID (editable)" Foreground="#FFBACBE2" FontSize="12"/>
                    <TextBox x:Name="HfModel" Text="openai/gpt-oss-120b:fastest" PlaceholderText="e.g. provider-supported model ID" Margin="0,3,0,8"/>
                    <TextBlock Text="Hugging Face access token" Foreground="#FFBACBE2" FontSize="12"/>
                    <PasswordBox x:Name="HfToken" PlaceholderText="Paste token with Inference Providers permission" Margin="0,3,0,5"/>
                    <TextBlock Text="The token is stored in the phone's Windows Credential Locker. Inference provider limits or charges may apply. Never share your token." Foreground="#FF8CA6C8" FontSize="12" TextWrapping="Wrap" Margin="0,0,0,8"/>
                    <Grid><Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="*"/><ColumnDefinition Width="*"/></Grid.ColumnDefinitions>
                      <Button Content="Save" Click="SaveAiSettings_Click" Margin="0,0,3,0"/>
                      <Button Grid.Column="1" Content="Test AI" Click="TestAi_Click" Margin="2,0"/>
                      <Button Grid.Column="2" Content="Forget token" Click="ForgetToken_Click" Margin="3,0,0,0"/>
                    </Grid>
                    <Button Content="Get / manage token on Hugging Face" Click="OpenHf_Click" Margin="0,8,0,0"/>
                  </StackPanel>
                </Border>
              </StackPanel></ScrollViewer>
              <StackPanel Grid.Row="2" Background="#FF11192B" Padding="8,7">
                <Grid><Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="48"/><ColumnDefinition Width="48"/></Grid.ColumnDefinitions>
                  <TextBox x:Name="Prompt" PlaceholderText="Chat with Pongo…" FontSize="16" KeyDown="Prompt_KeyDown" VerticalContentAlignment="Center"/>
                  <Button Grid.Column="1" Content="➤" Click="Send_Click" Margin="4,0,0,0"/>
                  <Button Grid.Column="2" Content="🎙" Click="Listen_Click" Margin="4,0,0,0"/>
                </Grid>
                <Grid Margin="0,5,0,0"><Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="*"/><ColumnDefinition Width="*"/></Grid.ColumnDefinitions>
                  <Button Content="Time" Click="Time_Click" Margin="0,0,3,0"/>
                  <Button Grid.Column="1" Content="Notes" Click="Notes_Click" Margin="2,0"/>
                  <Button Grid.Column="2" Content="Web search" Click="Search_Click" Margin="3,0,0,0"/>
                </Grid>
              </StackPanel>
              <MediaElement x:Name="Speech" Width="1" Height="1" Opacity="0" AutoPlay="False"/>
            </Grid>
          </Page>
          '@ | Set-Content (Join-Path $root 'MainPage.xaml') -Encoding utf8

          @'
          using System;
          using System.Net.Http;
          using System.Net.Http.Headers;
          using System.Text;
          using System.Text.RegularExpressions;
          using System.Threading.Tasks;
          using Windows.Media.SpeechRecognition;
          using Windows.Media.SpeechSynthesis;
          using Windows.Security.Credentials;
          using Windows.Storage;
          using Windows.System;
          using Windows.Data.Json;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;
          using Windows.UI.Xaml.Input;

          namespace PongoLumia {
            public sealed partial class MainPage : Page {
              private bool busy;
              private readonly ApplicationDataContainer data = ApplicationData.Current.LocalSettings;
              private static readonly HttpClient http = new HttpClient();

              public MainPage() {
                InitializeComponent();
                HfModel.Text = data.Values.ContainsKey("HfModel") ? data.Values["HfModel"].ToString() : "openai/gpt-oss-120b:fastest";
                UseHfAi.IsChecked = data.Values.ContainsKey("UseHfAi") && data.Values["UseHfAi"].ToString() == "True";
                Conversation.Text = data.Values.ContainsKey("ChatHistory") ? data.Values["ChatHistory"].ToString() : "PONGO  •  READY\r\nI'm your penguin assistant. Ask me a question, give me a simple command, or use ⚙ AI to connect a Hugging Face model.\r\n\r\n";
                Status.Text = UseHfAi.IsChecked == true && !String.IsNullOrWhiteSpace(GetSavedHfToken()) ? "Hugging Face AI enabled" : "Offline helper ready";
              }

              private void Settings_Click(object sender, RoutedEventArgs e) {
                AiSettingsPanel.Visibility = AiSettingsPanel.Visibility == Visibility.Visible ? Visibility.Collapsed : Visibility.Visible;
                if (AiSettingsPanel.Visibility == Visibility.Visible) Status.Text = "Configure offline or Hugging Face AI below.";
              }

              private async void Send_Click(object sender, RoutedEventArgs e) { await Submit(Prompt.Text); }
              private async void Prompt_KeyDown(object sender, KeyRoutedEventArgs e) {
                if (e.Key == VirtualKey.Enter) { e.Handled = true; await Submit(Prompt.Text); }
              }

              private async void Listen_Click(object sender, RoutedEventArgs e) {
                try {
                  Status.Text = "Listening…";
                  using (var recognizer = new SpeechRecognizer()) {
                    recognizer.Constraints.Add(new SpeechRecognitionTopicConstraint(SpeechRecognitionScenario.Dictation, "assistant request"));
                    var compilation = await recognizer.CompileConstraintsAsync();
                    if (compilation.Status != SpeechRecognitionResultStatus.Success) { Status.Text = "Voice recognition is not ready. Try typing instead."; return; }
                    var result = await recognizer.RecognizeWithUIAsync();
                    if (result.Status == SpeechRecognitionResultStatus.Success) { Prompt.Text = result.Text; await Submit(result.Text); }
                    else Status.Text = "Didn't catch that. Try again or type.";
                  }
                } catch (Exception) { Status.Text = "Voice input isn't available right now."; }
              }

              private string GetSavedHfToken() {
                try {
                  var vault = new PasswordVault();
                  var items = vault.FindAllByResource("PongoHuggingFace");
                  foreach (var item in items) {
                    if (item.UserName == "hf-token") { item.RetrievePassword(); return item.Password; }
                  }
                } catch { }
                return "";
              }

              private void StoreHfToken(string token) {
                var vault = new PasswordVault();
                try {
                  var items = vault.FindAllByResource("PongoHuggingFace");
                  foreach (var item in items) vault.Remove(item);
                } catch { }
                if (!String.IsNullOrWhiteSpace(token))
                  vault.Add(new PasswordCredential("PongoHuggingFace", "hf-token", token.Trim()));
              }

              private void SaveAiSettings_Click(object sender, RoutedEventArgs e) {
                try {
                  if (!String.IsNullOrWhiteSpace(HfToken.Password)) StoreHfToken(HfToken.Password);
                  data.Values["HfModel"] = String.IsNullOrWhiteSpace(HfModel.Text) ? "openai/gpt-oss-120b:fastest" : HfModel.Text.Trim();
                  data.Values["UseHfAi"] = UseHfAi.IsChecked == true;
                  HfToken.Password = "";
                  Status.Text = UseHfAi.IsChecked == true
                    ? (String.IsNullOrWhiteSpace(GetSavedHfToken()) ? "AI enabled in settings, but add a token first." : "AI settings saved. Your token stays in the phone's Credential Locker.")
                    : "Offline mode selected. No token is needed.";
                } catch (Exception) {
                  Status.Text = "Couldn't save settings. Check that the token is valid text and try again.";
                }
              }

              private async void TestAi_Click(object sender, RoutedEventArgs e) {
                SaveAiSettings_Click(sender, e);
                try {
                  Status.Text = "Testing the selected Hugging Face model…";
                  string answer = await AskHuggingFaceAsync("Reply with a short sentence confirming this connection test worked.");
                  Conversation.Text += "PONGO • AI TEST\r\n" + answer + "\r\n\r\n";
                  SaveChat();
                  Status.Text = "Hugging Face connection test succeeded.";
                } catch (Exception ex) {
                  Status.Text = "AI test failed: " + ex.Message;
                }
              }

              private void ForgetToken_Click(object sender, RoutedEventArgs e) {
                try { StoreHfToken(""); HfToken.Password = ""; Status.Text = "Saved Hugging Face token removed from this phone."; }
                catch (Exception) { Status.Text = "Couldn't remove the saved token."; }
              }

              private async void OpenHf_Click(object sender, RoutedEventArgs e) {
                await Launcher.LaunchUriAsync(new Uri("https://huggingface.co/settings/tokens"));
              }

              private async Task Submit(string raw) {
                string question = (raw ?? "").Trim();
                if (question.Length == 0 || busy) return;
                Prompt.Text = "";
                Conversation.Text += "YOU\r\n" + question + "\r\n\r\n";
                busy = true;
                Status.Text = "Pongo is thinking…";
                string answer = "";
                try {
                  string lower = question.ToLowerInvariant();
                  if (lower == "time" || lower.Contains("what time") || lower == "current time") {
                    answer = "It is " + DateTime.Now.ToString("h:mm tt") + ". You're welcome. I do enjoy being right on time.";
                  } else if (lower == "date" || lower.Contains("what date") || lower.Contains("what day is it") || lower == "today") {
                    answer = "It is " + DateTime.Now.ToString("dddd, MMMM d, yyyy") + ". You may applaud quietly.";
                  } else if (lower.StartsWith("note ") || lower.StartsWith("remember this ")) {
                    string note = lower.StartsWith("note ") ? question.Substring(5) : question.Substring(14);
                    string old = data.Values.ContainsKey("Notes") ? data.Values["Notes"].ToString() : "";
                    data.Values["Notes"] = (old.Length == 0 ? "" : old + "\r\n") + DateTime.Now.ToString("g") + " | " + note;
                    answer = "Saved your note. I put it somewhere safe, unlike your attention span.";
                  } else if (lower.Contains("show my notes") || lower == "notes" || lower == "my notes" || lower == "show notes") {
                    answer = data.Values.ContainsKey("Notes") && !String.IsNullOrWhiteSpace(data.Values["Notes"].ToString())
                      ? data.Values["Notes"].ToString()
                      : "No notes yet. A blank page. Much like your planning. Try: note buy milk";
                  } else if (lower.StartsWith("search ") || lower.StartsWith("google ") || lower.StartsWith("look up ")) {
                    string query = question;
                    if (lower.StartsWith("search ")) query = question.Substring(7);
                    else if (lower.StartsWith("google ")) query = question.Substring(7);
                    else query = question.Substring(8);
                    await Launcher.LaunchUriAsync(new Uri("https://www.bing.com/search?q=" + Uri.EscapeDataString(query)));
                    answer = "I've opened web results for: " + query + ". That's your live lookup; come back here when you've found something interesting.";
                  } else if (lower.StartsWith("open ")) {
                    string site = lower.Substring(5).Trim();
                    string url = site.Contains("youtube") ? "https://m.youtube.com/" :
                      site.Contains("wikipedia") ? "https://en.wikipedia.org/" :
                      site.Contains("github") ? "https://github.com/" :
                      site.Contains("hugging face") || site.Contains("huggingface") ? "https://huggingface.co/" :
                      site.Contains("google") ? "https://www.google.com/" : null;
                    if (url != null) { await Launcher.LaunchUriAsync(new Uri(url)); answer = "Opening " + site + ". Naturally, I picked a good one."; }
                    else answer = "Try: open YouTube, Wikipedia, GitHub, Google, or Hugging Face.";
                  } else if (UseHfAi.IsChecked == true && !String.IsNullOrWhiteSpace(GetSavedHfToken())) {
                    try {
                      answer = await AskHuggingFaceAsync(question);
                    } catch (Exception ex) {
                      answer = "I couldn't reach the Hugging Face model. Check internet access, token permission, model ID, and provider credits. Details: " + ex.Message;
                      Status.Text = "AI request failed; offline helper is still available.";
                    }
                  } else {
                    answer = LocalReply(question);
                  }

                  Conversation.Text += "PONGO\r\n" + answer + "\r\n\r\n";
                  SaveChat();
                  if (Status.Text == "Pongo is thinking…") Status.Text = UseHfAi.IsChecked == true && !String.IsNullOrWhiteSpace(GetSavedHfToken()) ? "Ready • Hugging Face AI" : "Ready • Offline helper";
                  try {
                    string spoken = answer.Length > 260 ? answer.Substring(0, 260) : answer;
                    using (var synthesizer = new SpeechSynthesizer()) {
                      var stream = await synthesizer.SynthesizeTextToStreamAsync(spoken);
                      Speech.SetSource(stream, stream.ContentType);
                      Speech.Play();
                    }
                  } catch { }
                } catch (Exception) {
                  Status.Text = "Something went wrong. Try again or use Web search.";
                  Conversation.Text += "PONGO\r\nThat didn't work as expected. Try again, or use Web search. Even penguins have off days.\r\n\r\n";
                  SaveChat();
                } finally { busy = false; }
              }

              private string LocalReply(string question) {
                string l = question.ToLowerInvariant();
                if (l == "hi" || l == "hello" || l == "hey" || l == "yo" || l.Contains("good morning"))
                  return "Hello. Pongo here: penguin, assistant, and clearly the most qualified creature in this room. What's up?";
                if (l.Contains("who are you") || l.Contains("your name") || l == "what are you")
                  return "I'm Pongo, your slightly self-important penguin assistant. Offline I can do notes, date/time, simple maths, and web shortcuts. Connect Hugging Face AI in ⚙ AI for more open-ended chat and coding.";
                if (l == "help" || l.Contains("what can you do") || l.Contains("how do i use you"))
                  return "Try: 'what time is it', 'note ...', 'show my notes', 'search Minecraft redstone', or 'open YouTube'. For general questions, explanations, and coding, open ⚙ AI, add a Hugging Face inference token, choose a supported model, enable AI, then Save.";
                if (l.Contains("how are you"))
                  return "Excellent. I have all my feathers and a frankly outstanding user interface. How are you?";
                if (l.Contains("thank"))
                  return "You're welcome. Compliments are also welcome, though I prefer accurate ones.";
                var math = Regex.Match(l, @"(-?[0-9]+(?:\.[0-9]+)?)\s*([+\-*/x])\s*(-?[0-9]+(?:\.[0-9]+)?)");
                if (math.Success) {
                  double x, y;
                  if (Double.TryParse(math.Groups[1].Value, System.Globalization.NumberStyles.Float, System.Globalization.CultureInfo.InvariantCulture, out x) &&
                      Double.TryParse(math.Groups[3].Value, System.Globalization.NumberStyles.Float, System.Globalization.CultureInfo.InvariantCulture, out y)) {
                    string op = math.Groups[2].Value;
                    double z = op == "+" ? x + y : (op == "-" ? x - y : ((op == "x" || op == "*") ? x * y : (y == 0 ? Double.NaN : x / y)));
                    return Double.IsNaN(z) ? "I refuse to divide by zero. Even I have standards." : x.ToString(System.Globalization.CultureInfo.InvariantCulture) + " " + op + " " + y.ToString(System.Globalization.CultureInfo.InvariantCulture) + " = " + z.ToString(System.Globalization.CultureInfo.InvariantCulture) + ". Math complete. You're welcome.";
                  }
                }
                if (l.Contains("code") || l.Contains("program") || l.Contains("python") || l.Contains("javascript") || l.Contains("write a") || l.Contains("explain"))
                  return "I'd like to help with that properly, but my offline brain is deliberately tiny. Open ⚙ AI and connect a Hugging Face model for generated code and detailed explanations. Or use Web search to find documentation.";
                if (l.Contains("hugging face") || l.Contains("transformers") || l.Contains("local ai"))
                  return "Hugging Face models can power my chat through the hosted Inference Providers API. That needs internet and a token. Running full Transformers/PyTorch directly inside this older Windows 10 Mobile app isn't realistically supported; this offline mini-brain is the local fallback.";
                return "I heard you. My built-in offline brain is small, so I can't reason about everything yet. For a fuller answer, open ⚙ AI and configure Hugging Face; for current information, type 'search ' followed by your question. I promise to remain impressively penguin-shaped.";
              }

              private async Task<string> AskHuggingFaceAsync(string question) {
                string token = GetSavedHfToken();
                if (String.IsNullOrWhiteSpace(token)) throw new InvalidOperationException("Add a Hugging Face token in ⚙ AI settings first.");
                string model = String.IsNullOrWhiteSpace(HfModel.Text) ? "openai/gpt-oss-120b:fastest" : HfModel.Text.Trim();
                string history = Conversation.Text ?? "";
                if (history.Length > 3600) history = history.Substring(history.Length - 3600);
                var system = new JsonObject();
                system["role"] = JsonValue.CreateStringValue("system");
                system["content"] = JsonValue.CreateStringValue("You are Pongo, a slightly self-centered, witty penguin assistant who is genuinely useful and kind. Answer clearly, help with reasoning and programming, and provide runnable code when asked. Never claim code was executed unless you truly executed it. State uncertainty honestly. For current facts, explain when a web search is needed. Keep ordinary answers concise, but give useful detail for code.");
                var user = new JsonObject();
                user["role"] = JsonValue.CreateStringValue("user");
                user["content"] = JsonValue.CreateStringValue("Recent conversation transcript:\r\n" + history + "\r\nLatest user message: " + question + "\r\nPlease answer the latest user message directly.");
                var messages = new JsonArray();
                messages.Add(system);
                messages.Add(user);
                var payload = new JsonObject();
                payload["model"] = JsonValue.CreateStringValue(model);
                payload["messages"] = messages;
                payload["max_tokens"] = JsonValue.CreateNumberValue(600);
                payload["temperature"] = JsonValue.CreateNumberValue(0.6);
                payload["stream"] = JsonValue.CreateBooleanValue(false);
                using (var request = new HttpRequestMessage(HttpMethod.Post, "https://router.huggingface.co/v1/chat/completions")) {
                  request.Headers.Authorization = new AuthenticationHeaderValue("Bearer", token);
                  request.Content = new StringContent(payload.Stringify(), Encoding.UTF8, "application/json");
                  using (var response = await http.SendAsync(request)) {
                    if (!response.IsSuccessStatusCode) {
                      throw new InvalidOperationException("Hugging Face returned HTTP " + ((int)response.StatusCode).ToString() + ". Check your token's Inference Providers permission, model ID, and account credits.");
                    }
                    string raw = await response.Content.ReadAsStringAsync();
                    var parsed = JsonObject.Parse(raw);
                    var choices = parsed.GetNamedArray("choices");
                    if (choices == null || choices.Count == 0) throw new InvalidOperationException("The model returned no answer.");
                    string answer = choices.GetObjectAt(0).GetNamedObject("message").GetNamedString("content", "");
                    if (String.IsNullOrWhiteSpace(answer)) throw new InvalidOperationException("The model returned an empty answer.");
                    return answer.Trim();
                  }
                }
              }

              private void SaveChat() {
                string value = Conversation.Text ?? "";
                if (value.Length > 12000) value = value.Substring(value.Length - 12000);
                data.Values["ChatHistory"] = value;
              }

              private async void Time_Click(object sender, RoutedEventArgs e) { await Submit("what time is it"); }
              private async void Notes_Click(object sender, RoutedEventArgs e) { await Submit("show my notes"); }
              private async void Search_Click(object sender, RoutedEventArgs e) {
                string query = Prompt.Text.Trim();
                if (query.Length == 0) query = "latest technology news";
                Prompt.Text = "";
                await Launcher.LaunchUriAsync(new Uri("https://www.bing.com/search?q=" + Uri.EscapeDataString(query)));
                Status.Text = "Opened live web search. Return to Pongo to keep chatting.";
              }
            }
          }

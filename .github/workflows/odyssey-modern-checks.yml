name: Odyssey modernization checks

on:
  push:
    branches:
      - odyssey-modern-browser-work
  pull_request:
    branches:
      - odyssey-modern-browser-work
  workflow_dispatch:
    inputs:
      action:
        description: "Run the cross-build, configure-only check, or static checks"
        required: true
        type: choice
        options:
          - full-build
          - configure-only
          - checks-only
        default: full-build
      profile:
        description: "balanced favors size/build stability; fast uses -O3"
        required: true
        type: choice
        options:
          - balanced
          - fast
        default: balanced

permissions:
  contents: read

# Keep fast checks fresh without terminating multi-hour cross-compiles on every
# documentation/test commit. A newer explicit full build can replace an older
# one; routine check commits use a separate group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[os4-build]')) || (github.event_name == 'workflow_dispatch' && inputs.action == 'full-build')) && 'full-build' || 'checks' }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Python syntax
        run: python -m py_compile OdysseyModern/prepare-upstream.py OdysseyModern/prepare-os4-upstream.py OdysseyModern/tests/test_prepare_upstream.py OdysseyModern/tests/test_prepare_os4_upstream.py OdysseyModern/tests/test_compare_reports.py OdysseyModern/tests/test_icu_platform_fragment.py OdysseyModern/tests/test_os4_thread_preflight.py OdysseyModern/benchmarks/compare-reports.py OdysseyModern/tests/check_html_scripts.py
      - name: Test downstream patch application
        run: python OdysseyModern/tests/test_prepare_upstream.py
      - name: Test AmigaOS 4 source-port patcher
        run: python OdysseyModern/tests/test_prepare_os4_upstream.py
      - name: Test benchmark report comparison
        run: python OdysseyModern/tests/test_compare_reports.py
      - name: Test ICU target make-fragment staging
        run: python OdysseyModern/tests/test_icu_platform_fragment.py
      - name: Test early native-thread linker preflight
        run: python OdysseyModern/tests/test_os4_thread_preflight.py
      - name: Check browser test JavaScript syntax
        run: python OdysseyModern/tests/check_html_scripts.py
      - name: Check shell syntax
        run: |
          bash -n OdysseyModern/fetch-and-build-aros.sh
          bash -n OdysseyModern/fetch-and-build-os4.sh
          bash -n OdysseyModern/build-icu-os4.sh
          bash -n OdysseyModern/run-os4-docker.sh
      - name: Validate experimental OS4 CMake toolchain syntax
        run: cmake -P OdysseyModern/toolchains/AMIGAOS4.cmake
      - name: Check whitespace errors
        run: git diff --check

  os4-configure:
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'configure-only') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[os4-configure]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure the actual upstream tree against the AmigaOS 4 SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull walkero/amigagccondocker:os4-gcc11-3.5.2
          docker run --rm --init \
            --volume "$PWD:/opt/code" \
            --workdir /opt/code \
            --env ODYSSEY_CONFIGURE_ONLY=1 \
            --env ODYSSEY_BUILD_PROFILE=${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'balanced' }} \
            walkero/amigagccondocker:os4-gcc11-3.5.2 \
            bash OdysseyModern/fetch-and-build-os4.sh
      - name: Upload configuration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-os4-configure-logs
          path: |
            cross-build-amigaos4/odyssey-configure.log
            cross-build-amigaos4/CMakeCache.txt
          if-no-files-found: warn


  os4-build:
    # Full PPC compilation is deliberately explicit because WebKit is large and
    # the standard runner has finite memory/time. Push a commit with [os4-build].
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'full-build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[os4-build]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .odyssey-ccache
          key: ${{ runner.os }}-odyssey-os4-ccache-gcc11-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-odyssey-os4-ccache-
      - name: Build AmigaOS 4 PPC Odyssey
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .odyssey-ccache
          docker pull walkero/amigagccondocker:os4-gcc11-3.5.2
          docker run --rm --init \
            --volume "$PWD:/opt/code" \
            --volume "$PWD/.odyssey-ccache:/opt/odyssey-ccache" \
            --workdir /opt/code \
            --env BUILD_JOBS=1 \
            --env CCACHE_DIR=/opt/odyssey-ccache \
            --env ODYSSEY_CCACHE=auto \
            --env ODYSSEY_BUILD_PROFILE=${{ github.event_name == 'workflow_dispatch' && inputs.profile || (contains(github.event.head_commit.message, '[fast]') && 'fast' || 'balanced') }} \
            walkero/amigagccondocker:os4-gcc11-3.5.2 \
            bash OdysseyModern/fetch-and-build-os4.sh
      - name: Package experimental application if the link succeeds
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x cross-build-amigaos4/bin/OWB
          mkdir -p Odyssey-OS4-Experimental
          cp -a odyssey-upstream-os4/Dist/. Odyssey-OS4-Experimental/
          cp cross-build-amigaos4/bin/OWB Odyssey-OS4-Experimental/OWB
          cp odyssey-upstream-os4/README.md Odyssey-OS4-Experimental/UPSTREAM-README.md
          cp icu-source-os4/icu4c/license.html Odyssey-OS4-Experimental/ICU-LICENSE.html
          cp cross-build-icu-os4/ICU-BUILD-INFO.txt Odyssey-OS4-Experimental/ICU-BUILD-INFO.txt
          mkdir -p Odyssey-OS4-Experimental/TESTS
          cp OdysseyModern/tests/modern-web-check.html Odyssey-OS4-Experimental/TESTS/Modern-Web-Checks.html
          cp OdysseyModern/benchmarks/browser-benchmark.html Odyssey-OS4-Experimental/TESTS/Performance-Benchmark.html
          cp OdysseyModern/benchmarks/compare-reports.py Odyssey-OS4-Experimental/TESTS/compare-reports.py
          cat > Odyssey-OS4-Experimental/BUILD-STATUS.txt <<'EOF'
          EXPERIMENTAL BUILD - NOT YET VERIFIED ON AMIGAOS 4.1 UPDATE 3

          This package was cross-compiled for AmigaOS 4 PPC from the Odyssey
          WebKit codebase. It is not certified secure or compatible with all
          current websites. The initial build disables several unsupported
          features and uses the JavaScript interpreter (no PPC JIT backend).
          Test on a backed-up test installation first and keep OS libraries/SDK
          dependencies matched to the build environment.
          EOF
          cat > Odyssey-OS4-Experimental/BUILD-METADATA.txt <<EOF
          Upstream repository: https://github.com/deadwood2/OdysseyWebBrowser
          Upstream branch: odyssey
          Upstream commit: $(git -C odyssey-upstream-os4 rev-parse HEAD)
          Target: AmigaOS 4 PPC (unverified on an AmigaOS 4.1 Update 3 device)
          CMake configuration: Release
          C++ optimization: -O2 (balanced profile)
          JavaScript engine: C-loop interpreter; no PPC JIT/FTL JIT
          Disabled in this baseline: WebAssembly, Web Audio, WebCrypto, WebGL, Service Workers
          Validation required: runtime startup, HTTPS/TLS, real sites, media, tabs, and benchmark pages
          EOF
          cat > Odyssey-OS4-Experimental/TESTS/README.txt <<'EOF'
          MODERN-WEB CHECKS
          Open Modern-Web-Checks.html in Odyssey to identify missing APIs and run
          small JavaScript/storage/layout smoke tests. Open it over HTTP(S) when
          possible to exercise same-origin Fetch. A PASS is not a standards or
          security certification.

          PERFORMANCE BENCHMARK
          Run Performance-Benchmark.html five times after warm-up on the same
          machine, and save the JSON result on a host computer for comparison.
          Lower milliseconds are better. Compare only matching hardware and
          browser builds. Synthetic scores are not full-page browsing scores.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path("Odyssey-OS4-Experimental")
          with ZipFile("odyssey-os4-ppc-experimental.zip", "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())
          PY
      - name: Upload executable, package and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-os4-ppc-experimental
          path: |
            odyssey-os4-ppc-experimental.zip
            cross-build-amigaos4/odyssey-configure.log
            cross-build-amigaos4/odyssey-build.log
            cross-build-amigaos4/CMakeCache.txt
            cross-build-amigaos4/bin/**
            cross-build-amigaos4/lib/**
            cross-build-icu-os4/icu-host-build.log
            cross-build-icu-os4/icu-target-build.log
            cross-build-icu-os4/ICU-BUILD-INFO.txt
            cross-build-icu-os4/target-install/lib/*.a
          if-no-files-found: warn
          compression-level: 1
